name: "Prod Terraform Workflow"

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: "Type DESTROY to approve infrastructure deletion"
        required: true
        type: choice
        options:
          - NO
          - DESTROY

permissions:
  id-token: write
  contents: read

jobs:

  # -----------------------------------------
  # JOB 1: TERRAFORM INIT AND PLAN
  # -----------------------------------------

  terraform-init-plan:
    if: github.event_name != 'workflow_dispatch'
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Azure Login
        uses: Azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform fmt
        run: terraform fmt -check
        working-directory: .

      - name: Terraform Init
        run: terraform init -input=false
        working-directory: .

      - name: Terraform Validate
        run: terraform validate -no-color
        working-directory: .

      - name: Terraform Plan
        id: plan
        run: terraform plan -input=false -out=tfplan
        working-directory: .

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: tfplan
          retention-days: 1

  # -----------------------------------------
  # JOB 2: TERRAFORM APPLY
  # -----------------------------------------

  terraform-apply:
    runs-on: self-hosted

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    needs: terraform-init-plan

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Azure Login
        uses: Azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        run: terraform init -input=false
        working-directory: .

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: .

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve tfplan
        working-directory: .

  # -----------------------------------------
  # JOB 3: TERRAFORM DESTROY
  # -----------------------------------------

  terraform-destroy:
    runs-on: self-hosted

    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.confirm_destroy == 'DESTROY'

    # GitHub Environment approval required
    environment: destroy

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Azure Login
        uses: Azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        run: terraform init -input=false
        working-directory: .

      - name: Terraform Destroy
        run: terraform destroy -input=false -auto-approve
        working-directory: .

