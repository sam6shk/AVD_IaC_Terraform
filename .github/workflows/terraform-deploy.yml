name: Azure Terraform Infrastructure Deployment

on:
  push:
    branches:
      - main
    paths:
      - '*.tf'
      - '*.tfvars'
      - '.terraform.lock.hcl'
      - '.github/workflows/terraform-deploy.yml'

  workflow_dispatch:
    inputs:
      apply:
        description: 'Apply Terraform changes to Azure?'
        required: true
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-main
  cancel-in-progress: false

jobs:

  terraform:
    name: Terraform Deployment

    runs-on: [self-hosted, Windows, X64]

    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      ARM_USE_OIDC: true
      ARM_USE_AZUREAD: true

    steps:

      # --------------------------------------------------
      # 1. Checkout Repository
      # --------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. Setup Terraform
      # --------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.3


      # --------------------------------------------------
      # 3. Azure Login using OIDC
      # --------------------------------------------------

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      # --------------------------------------------------
      # 4. Verify Azure Authentication
      # --------------------------------------------------

      - name: Verify Azure Login
        shell: powershell
        run: |
          Write-Host "Azure Account:"
          az account show


      # --------------------------------------------------
      # 5. Verify Repository Structure
      # --------------------------------------------------

      - name: Verify Repository Structure
        shell: powershell
        run: |
          Write-Host "Current Directory:"
          Get-Location

          Write-Host ""
          Write-Host "Repository Files:"
          Get-ChildItem -Force

          Write-Host ""
          Write-Host "Terraform Files:"
          Get-ChildItem -Path . -Filter *.tf -Recurse |
            Select-Object -ExpandProperty FullName


      # --------------------------------------------------
      # 6. Terraform Format Check
      # --------------------------------------------------

      - name: Terraform Format Check
        run: terraform fmt -check -recursive


      # --------------------------------------------------
      # 7. Terraform Init
      # --------------------------------------------------

      - name: Terraform Init
        run: terraform init -input=false


      # --------------------------------------------------
      # 8. Terraform Validate
      # --------------------------------------------------

      - name: Terraform Validate
        run: terraform validate


      # --------------------------------------------------
      # 9. Terraform Plan
      # --------------------------------------------------

      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan


      # --------------------------------------------------
      # 10. Terraform Apply
      # --------------------------------------------------

      - name: Terraform Apply
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply == true }}
        run: terraform apply -input=false -auto-approve tfplan
