name: "build AVD infra"
on:
  push: 
    branches: 
      - main
      - 'feature/**'

  pull_request: 
    branches: 
      - main  
  workflow_dispatch: 
jobs:
  terraform-job:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v5.0.0

      - name: Install Terraform
        uses: little-core-labs/install-terraform@v2.0.0
        with:
          # Version of terraform to download
          version: 1.13.0
      - name: Terraform init
        uses: comu2e/tfnotify-composite-action@1.0.4
        with:
          name: # optional
